<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Fraud Detection System</h1>
        <div class="card">
            <div class="card-header bg-primary text-white">
                Transaction Information
            </div>
            <div class="card-body">
                <div id="amount-warning" class="alert alert-warning mb-3 d-none">
                    <strong>Warning:</strong> The amount you entered exceeds ${{ amount_threshold }}. Predictions may be less accurate for unusually large transactions.
                </div>
                <form id="predictionForm">
                    <div class="mb-3">
                        <label for="amount" class="form-label">Transaction Amount ($)</label>
                        <input type="number" class="form-control" id="amount" name="amount" step="0.01" min="0.01" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label">Transaction Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" disabled selected>Select a category</option>
                            {% for category in categories %}
                                <option value="{{ category }}">{{ category.replace('_', ' ').title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="hour" class="form-label">Hour of Transaction (0-23)</label>
                        <input type="number" class="form-control" id="hour" name="hour" min="0" max="23" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="model_type" class="form-label">Model Type</label>
                        <select class="form-select" id="model_type" name="model_type">
                            <option value="knn">K-Nearest Neighbors (KNN)</option>
                            <option value="decision_tree">Decision Tree</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Predict</button>
                </form>
            </div>
        </div>
        
        <div id="resultCard" class="card mt-4 d-none">
            <div class="card-header">
                Prediction Result
            </div>
            <div class="card-body">
                <div id="resultContent">
                    <!-- Results will be displayed here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        // Pass the threshold to JavaScript
        const AMOUNT_THRESHOLD = {{ amount_threshold }};
    </script>
</body>
</html>
